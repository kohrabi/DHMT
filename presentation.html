<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo cáo Đồ án Đồ họa máy tính - CS105</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #1a1b26;
        --surface: #24283b;
        --text: #c0caf5;
        --muted: #565f89;
        --accent: #7aa2f7;
        --green: #9ece6a;
        --yellow: #e0af68;
        --red: #f7768e;
        --cyan: #7dcfff;
        --border: #3b4261;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #sbar {
        display: flex;
        align-items: center;
        padding: 4px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        gap: 8px;
        flex-shrink: 0;
        min-height: 28px;
      }
      #sbar span.dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        cursor: pointer;
      }
      #sbar span.dot.active {
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }
      #sbar #slide-counter {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }
      #slides {
        flex: 1;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 8px;
        min-height: 0;
      }
      .slide {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        max-width: 1280px;
      }
      .slide h1 {
        font-size: 20px;
        color: var(--accent);
        border-bottom: 2px solid var(--border);
        padding-bottom: 4px;
        flex-shrink: 0;
      }
      .slide h2 {
        font-size: 13px;
        color: var(--yellow);
        margin-top: 2px;
        flex-shrink: 0;
      }
      .slide h3 {
        font-size: 12px;
        color: var(--cyan);
        margin: 0;
        flex-shrink: 0;
      }
      .slide p,
      .slide li {
        font-size: 11px;
        line-height: 1.4;
        color: var(--text);
      }
      .slide ul {
        padding-left: 14px;
      }
      .slide ul li {
        margin: 0;
      }
      .slide-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .slide-content > .grid2,
      .slide-content > .grid3 {
        flex: 1;
        min-height: 0;
      }
      .slide-content > .card {
        flex-shrink: 0;
      }
      .grid2 > .card,
      .grid3 > .card {
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: flex-start;
      }
      .card > ul {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        padding-left: 14px;
      }
      .slide-content > .grid2,
      .slide-content > .grid3,
      .slide-content > .card {
        flex-shrink: 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        min-height: 0;
      }
      .grid3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        min-height: 0;
      }
      .card {
        background: #1a1b2e;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 6px 10px;
      }
      .card h3 {
        margin-bottom: 2px;
      }
      .tag {
        display: inline-block;
        background: var(--accent);
        color: var(--bg);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 9px;
        margin: 1px;
        font-weight: bold;
      }
      .tag.green {
        background: var(--green);
      }
      .tag.yellow {
        background: var(--yellow);
      }
      .tag.red {
        background: var(--red);
      }
      .img-placeholder {
        border: 2px dashed var(--muted);
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 10px;
        background: #1a1b2e;
        text-align: center;
        padding: 8px;
        flex: 1;
        min-height: 0;
      }

      /* Cấu hình SVG mặc định: Cho phép co giãn tối đa theo khung cha mà không mất tỷ lệ */
      svg.diagram {
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        display: block;
        margin: 0 auto;
        background: #1a1b2e;
        border-radius: 4px;
        border: 1px solid var(--border);
        flex-shrink: 1;
        min-height: 0;
      }
      svg.diagram text {
        font-family: "Segoe UI", system-ui, sans-serif;
        fill: var(--text);
        font-size: 9px;
      }
      svg.diagram text.title {
        font-size: 11px;
        font-weight: bold;
        fill: var(--accent);
      }
      svg.diagram rect.box {
        fill: #24283b;
        stroke: var(--border);
        rx: 3;
      }
      svg.diagram rect.accent {
        fill: #1a1b2e;
        stroke: var(--accent);
        rx: 3;
      }
      svg.diagram line.conn {
        stroke: var(--muted);
        stroke-width: 1;
      }
      svg.diagram line.arrow {
        stroke: var(--accent);
        stroke-width: 1.5;
        marker-end: url(#arrow);
      }

      .kv {
        display: flex;
        margin: 1px 0;
        font-size: 10px;
      }
      .kv .key {
        color: var(--muted);
        min-width: 120px;
      }
      .kv .val {
        font-weight: bold;
      }
      #nav-hint {
        position: fixed;
        bottom: 2px;
        right: 12px;
        color: var(--muted);
        font-size: 9px;
        z-index: 10;
        opacity: 0.6;
      }
      table {
        width: 100%;
        font-size: 9px;
        border-collapse: collapse;
        margin-top: 2px;
      }
      table td {
        padding: 1px 3px;
        border-bottom: 1px solid var(--border);
      }
      table tr:first-child td {
        color: var(--accent);
        font-weight: bold;
        border-bottom: 2px solid var(--border);
      }
      @media print {
        body {
          background: #fff;
          color: #000;
        }
        #sbar,
        #nav-hint {
          display: none;
        }
        .slide {
          page-break-after: always;
          background: #fff;
          border: 1px solid #ccc;
          color: #000;
          overflow: visible !important;
        }
        .slide-content {
          overflow: visible !important;
        }
        .slide h1 {
          color: #222;
        }
        .slide h2 {
          color: #444;
        }
      }
    </style>
    <svg style="display: none">
      <defs>
        <marker
          id="arrow"
          viewBox="0 0 10 10"
          refX="10"
          refY="5"
          markerWidth="5"
          markerHeight="5"
          orient="auto-start-reverse"
        >
          <path d="M0,0 L10,5 L0,10 Z" fill="#7aa2f7" />
        </marker>
      </defs>
    </svg>
  </head>

  <p style="font-size:12px; color:var(--accent); margin: 0;"><strong>Tổng kết:</strong> Dự án đã áp dụng toàn bộ kiến thức đồ họa 3D CS105 vào sản phẩm game hoàn chỉnh, kiến trúc rõ ràng, khả năng mở rộng tốt.</p>
  <p style="font-size:10px; color:var(--muted); margin-top:2px; margin-bottom: 0;">
    Source: &lt;&lt; LINK REPO &gt;&gt; &nbsp;·&nbsp; Demo: &lt;&lt; LINK DEMO &gt;&gt;
  </p>
</div>
`,
      });

      // ─── RENDER ──────────────────────────────────────────────────────────────────
      let cur = 0;
      const c = document.getElementById("slides");
      const s = document.getElementById("sbar");

      function r(i) {
        const sl = slides[i];
        c.innerHTML = `<div class="slide" style="display:flex">
    ${sl.title ? `<h1>${sl.title}</h1>` : ""}
    <div class="slide-content">${sl.content}</div>
  </div>`;
        s.querySelectorAll("span.dot").forEach((d, j) =>
          d.classList.toggle("active", j === i),
        );
        document.getElementById("slide-counter").textContent =
          `${i + 1} / ${slides.length}`;
      }
      function dots() {
        let h = "";
        for (let i = 0; i < slides.length; i++)
          h += `<span class="dot${i === 0 ? " active" : ""}" data-idx="${i}"></span>`;
        h += `<span id="slide-counter">1 / ${slides.length}</span>`;
        s.innerHTML = h;
        s.onclick = (e) => {
          const d = e.target.closest(".dot");
          if (d) {
            cur = +d.dataset.idx;
            r(cur);
          }
        };
      }
      dots();
      r(0);
      document.onkeydown = (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
          e.preventDefault();
          if (cur < slides.length - 1) {
            cur++;
            r(cur);
          }
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          if (cur > 0) {
            cur--;
            r(cur);
          }
        } else if (e.key === "Home") {
          e.preventDefault();
          cur = 0;
          r(cur);
        } else if (e.key === "End") {
          e.preventDefault();
          cur = slides.length - 1;
          r(cur);
        }
      };
    </script>
  </body>
</html>
