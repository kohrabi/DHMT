<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo Đồ án Đồ họa máy tính - CS105</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1b26;--surface:#24283b;--text:#c0caf5;--muted:#565f89;--accent:#7aa2f7;--green:#9ece6a;--yellow:#e0af68;--red:#f7768e;--cyan:#7dcfff;--border:#3b4261}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#slides{flex:1;display:flex;align-items:stretch;justify-content:center;min-height:0}
.slide{flex:1;display:flex;flex-direction:column;gap:5px;padding:14px 24px;overflow:hidden}
.slide h1{font-size:22px;color:var(--accent);border-bottom:2px solid var(--border);padding-bottom:4px;flex-shrink:0;margin:0 0 2px 0}
.slide h2{font-size:15px;color:var(--yellow);margin:2px 0;flex-shrink:0}
.slide h3{font-size:14px;color:var(--cyan);margin:0 0 4px 0;flex-shrink:0}
.slide p,.slide li{font-size:13px;line-height:1.35;color:var(--text)}
.slide ul{padding-left:14px;list-style:disc}
.slide ul li{margin:0}
.slide-content{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:1;min-height:0}
.card{background:#1a1b2e;border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;min-height:0;flex:1}
.card>ul{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.tag{display:inline-block;background:var(--accent);color:var(--bg);padding:1px 5px;border-radius:3px;font-size:11px;margin:1px;font-weight:bold}
.tag.green{background:var(--green)}.tag.yellow{background:var(--yellow)}.tag.red{background:var(--red)}
.img-placeholder{border:2px dashed var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:#1a1b2e;text-align:center;padding:12px;flex:1;min-height:0}
svg.diagram{display:block;width:100%;height:100%;min-height:0;background:#1a1b2e;border-radius:4px;border:1px solid var(--border)}
svg.diagram text{font-family:'Segoe UI',system-ui,sans-serif;fill:var(--text);font-size:9px}
svg.diagram text.title{font-size:10px;font-weight:bold;fill:var(--accent)}
svg.diagram rect.box{fill:#24283b;stroke:var(--border);rx:3}
svg.diagram rect.accent{fill:#1a1b2e;stroke:var(--accent);rx:3}
svg.diagram line.conn{stroke:var(--muted);stroke-width:1}
svg.diagram line.arrow{stroke:var(--accent);stroke-width:1.2;marker-end:url(#arrow)}
.kv{display:flex;margin:1px 0;font-size:12px}.kv .key{color:var(--muted);min-width:90px}.kv .val{font-weight:bold}
table{width:100%;font-size:11px;border-collapse:collapse;margin-top:2px}
table td{padding:2px 4px;border-bottom:1px solid var(--border)}
table tr:first-child td{color:var(--accent);font-weight:bold;border-bottom:2px solid var(--border)}
@media print{body{background:#fff;color:#000}.slide{page-break-after:always;background:#fff;color:#000;overflow:visible!important}.slide-content{overflow:visible!important}.slide h1{color:#222}.slide h2{color:#444}}
</style>
<svg style="display:none"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7aa2f7"/></marker></defs></svg>
</head>

S.push({t:"Các chức năng chính của chương trình",c:`
<div class="grid3" style="flex:1.1;min-height:0"><div class="card"><h3>Vẽ khối 3D & Load Model</h3><ul><li>BoxGeometry cho va chạm vật lý</li><li>Nạp mô hình GLTF nhân vật & map</li><li><strong>Pipeline chuyển trục:</strong> Đồng bộ hệ tọa độ Blender (Z-up) sang Three.js (Y-up)</li><li>Level tự động load từ JSON động</li></ul><div style="margin-top:auto"><span class="tag">GLTFLoader</span> <span class="tag yellow">Z-up to Y-up</span></div></div><div class="card"><h3>Camera & Phép chiếu</h3><ul><li><strong>PerspectiveCamera</strong> FOV 45°, near 1, far 500</li><li>Follow camera bám mục tiêu mềm mại</li><li><strong>Viewport Clamping:</strong> Giới hạn camera động không vượt biên PlayZone</li><li>Chế độ OrbitControls debug (C)</li></ul><div style="margin-top:auto"><span class="tag green">Perspective</span> <span class="tag">Clamp Math</span></div></div><div class="card"><h3>Phép biến đổi Affine</h3><ul><li><strong>Tịnh tiến:</strong> Cập nhật vị trí nhân vật, AI, hiệu ứng</li><li><strong>Xoay:</strong> Đồng xu xoay trục Y, mai rùa lăn trục X</li><li><strong>Tỉ lệ:</strong> Phóng to 1.5x khi ăn nấm, hiệu ứng Squash & Stretch khi nhảy</li></ul><div style="margin-top:auto"><span class="tag yellow">T·R·S</span> <span class="tag">Transform Matrix</span></div></div></div><div class="grid3" style="flex:1.1;min-height:0"><div class="card"><h3>Chiếu sáng & Bóng đổ</h3><ul><li><strong>DirectionalLight</strong> mặt trời di chuyển động theo camera</li><li><strong>HemisphereLight</strong> ánh sáng môi trường dịu mắt</li><li>Shadow Map: PCFSoft 2048x2048 mượt</li><li>Tự động bám trục sáng (Dynamic tracking)</li></ul><div style="margin-top:auto"><span class="tag">PCFSoft</span> <span class="tag green">Dynamic Shadow</span></div></div><div class="card"><h3>Texture & 3D Typography</h3><ul><li>PBR Materials từ GLTF (Roughness, Metal)</li><li>Canvas API tạo bầu trời chuyển sắc động</li><li><strong>3D Outline Text:</strong> Ghép đè 2 Mesh (Double-mesh) tạo viền chữ nổi bật</li></ul><div style="margin-top:auto"><span class="tag green">Canvas</span> <span class="tag">Double-Mesh Text</span></div></div><div class="card"><h3>Animation & Parallax</h3><ul><li>AnimationMixer phối hợp 16 clips chuyển động</li><li>Particle system: Hệ hạt bụi mô phỏng vật lý trượt, nhảy, tiếp đất</li><li><strong>Infinite 3D Parallax:</strong> Tái chế vô tận mô hình nền ở Main Menu</li></ul><div style="margin-top:auto"><span class="tag yellow">Keyframe</span> <span class="tag">Object Recycling</span></div></div></div>

S.push({t:"Giới thiệu các kỹ thuật đồ họa sử dụng",c:`
<div class="grid3" style="flex:1.2;min-height:0"><div class="card"><h3>1. Phép chiếu & Viewport Math</h3><div class="kv"><span class="key">Perspective</span><span class="val">FOV 45°, Near 1, Far 500</span></div><p style="margin-top:2px;color:var(--muted)">Khóa camera trong biên PlayZone bằng toán lượng giác:</p><div style="background:#1a1b2e;padding:4px;border-radius:4px;font-family:monospace;font-size:10px;color:var(--green)">halfH = dist * tan(FOV / 2)<br>halfW = halfH * aspect_ratio</div><p style="margin-top:2px;color:var(--muted)">Đảm bảo camera luôn nằm gọn trong màn chơi 2.5D.</p></div><div class="card"><h3>2. Phép biến đổi & Vật lý Retro</h3><table style="margin-top:1px"><tr><td>Dạng biến đổi</td><td>Giải thuật trong mã nguồn</td></tr><tr><td>Tịnh tiến</td><td>Ma trận T(dx,dy,dz) kết hợp mô phỏng <strong>Subpixel Physics (1/16³)</strong> chính xác chuyển động gốc</td></tr><tr><td>Xoay</td><td>R(θ,axis) xoay mai rùa trơn tru</td></tr><tr><td>Tỉ lệ</td><td>S(sx,sy,sz) nội suy tuyến tính (lerp) tạo hiệu ứng đàn hồi nén dãn khi nhảy</td></tr></table></div><div class="card"><h3>3. Chiếu sáng & Shadow</h3><div style="flex:1;min-height:0;display:flex;align-items:center"><svg class="diagram" viewBox="0 0 300 90" style="border:none;background:transparent;width:100%;height:100%"><rect x="5" y="3" width="140" height="26" class="box"/><text x="75" y="14" text-anchor="middle" fill="var(--yellow)" font-size="9">DirectionalLight</text><text x="75" y="24" text-anchor="middle" font-size="7">0xfff2cc · i=2.0</text><rect x="155" y="3" width="140" height="26" class="box"/><text x="225" y="14" text-anchor="middle" fill="var(--cyan)" font-size="9">HemisphereLight</text><text x="225" y="24" text-anchor="middle" font-size="7">sky/ground · i=2.0</text><rect x="5" y="35" width="290" height="46" style="fill:#1a1b2e;stroke:var(--green);rx:3;stroke-width:1.2"/><text x="150" y="50" text-anchor="middle" fill="var(--green)" font-size="9" font-weight="bold">Shadow Mapping: PCFSoft 2048×2048</text><text x="150" y="63" text-anchor="middle" font-size="7">Tự động đuổi trục sáng (Dynamic tracking) theo camera</text><text x="150" y="75" text-anchor="middle" font-size="7">Bias -0.001 chống lỗi sọc bóng (shadow acne)</text></svg></div></div></div><div class="grid3" style="flex:1.2;min-height:0"><div class="card"><h3>4. Vật lý Va chạm 60Hz</h3><ul style="line-height:1.35"><li><strong>Vòng lặp tích lũy (Accumulator):</strong> Đảm bảo tần số vật lý Rapier luôn chạy ổn định ở 60Hz bất kể tốc độ render của WebGL thay đổi.</li><li><strong>Deferred Call:</strong> Trì hoãn việc hủy Collider trong pha va chạm sang frame tiếp theo để tránh xung đột luồng xử lý vật lý.</li></ul></div><div class="card"><h3>5. Texture & Typography</h3><ul style="line-height:1.35"><li>Canvas Gradient: Sinh texture bầu trời chuyển sắc trực tiếp bằng mã nguồn mà không cần tải file ảnh tĩnh.</li><li><strong>Kỹ thuật Double-Mesh:</strong> Tạo viền 3D tương phản cao cho chữ điểm số bằng cách nhân bản khối hình học, dịch chuyển nhẹ trục Z (-0.02) và tô màu tương phản.</li></ul></div><div class="card"><h3>6. Hoạt cảnh & Tái chế đối tượng</h3><div style="flex:1;min-height:0;display:flex;align-items:center"><svg class="diagram" viewBox="0 0 300 100" style="border:none;background:transparent;width:100%;height:100%"><text x="150" y="10" text-anchor="middle" class="title" font-size="8">Cơ chế Infinite 3D Parallax Scrolling</text><rect x="5" y="18" width="135" height="18" class="box"/><text x="72" y="30" text-anchor="middle">Spawn theo cột</text><line x1="140" y1="27" x2="155" y2="27" class="arrow"/><rect x="160" y="18" width="135" height="18" class="box"/><text x="227" y="30" text-anchor="middle">Dịch chuyển trái</text><line x1="72" y1="36" x2="72" y2="48" class="arrow"/><line x1="227" y1="36" x2="227" y2="48" class="arrow"/><rect x="5" y="48" width="135" height="18" class="box"/><text x="72" y="60" text-anchor="middle">Kiểm tra biên trái</text><rect x="160" y="48" width="135" height="18" class="box"/><text x="227" y="60" text-anchor="middle">Vượt biên trượt</text><line x1="72" y1="66" x2="72" y2="76" class="arrow"/><line x1="227" y1="66" x2="227" y2="76" class="arrow"/><rect x="5" y="76" width="135" height="18" class="box"/><text x="72" y="88" text-anchor="middle">Teleport về biên phải</text><rect x="160" y="76" width="135" height="18" class="box"/><text x="227" y="88" text-anchor="middle">Tái ngẫu nhiên hóa tỉ lệ</text></svg></div></div></div><div class="card" style="flex-shrink:0;padding:6px 12px"><h3>7. Giải thuật nâng cao</h3><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1"><span class="tag" style="font-size:12px;padding:4px 10px">Z-up to Y-up Converter</span><span class="tag green" style="font-size:12px;padding:4px 10px">One-Way Platform Filter</span><span class="tag yellow" style="font-size:12px;padding:4px 10px">Subpixel Movement Scale</span><span class="tag" style="font-size:12px;padding:4px 10px">Unscaled Delta Timer</span><span class="tag green" style="font-size:12px;padding:4px 10px">Double-Mesh Font Outline</span></div></div>
`});

let cur=0;
const c=document.getElementById("slides");
function r(i){
  const sl=S[i];
  c.innerHTML=`<div class="slide" style="display:flex">${sl.t?`<h1>${sl.t}</h1>`:""}<div class="slide-content">${sl.c}</div></div>`;
}
r(0);
document.onkeydown=e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();if(cur<S.length-1){cur++;r(cur)}}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();if(cur>0){cur--;r(cur)}}
  else if(e.key==="Home"){e.preventDefault();cur=0;r(cur)}
  else if(e.key==="End"){e.preventDefault();cur=S.length-1;r(cur)}
};
</script>
