<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo Đồ án Đồ họa máy tính - CS105</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1b26;--surface:#24283b;--text:#c0caf5;--muted:#565f89;--accent:#7aa2f7;--green:#9ece6a;--yellow:#e0af68;--red:#f7768e;--cyan:#7dcfff;--border:#3b4261}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#slides{flex:1;display:flex;align-items:stretch;justify-content:center;min-height:0}
.slide{flex:1;display:flex;flex-direction:column;gap:5px;padding:14px 24px;overflow:hidden}
.slide h1{font-size:20px;color:var(--accent);border-bottom:2px solid var(--border);padding-bottom:4px;flex-shrink:0;margin:0 0 2px 0}
.slide h2{font-size:14px;color:var(--yellow);margin:2px 0;flex-shrink:0}
.slide h3{font-size:13px;color:var(--cyan);margin:0 0 4px 0;flex-shrink:0}
.slide p,.slide li{font-size:12px;line-height:1.35;color:var(--text)}
.slide ul{padding-left:14px;list-style:disc}
.slide ul li{margin:0}
.slide-content{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:1;min-height:0}
.card{background:#1a1b2e;border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;min-height:0;flex:1}
.card>ul{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.tag{display:inline-block;background:var(--accent);color:var(--bg);padding:1px 5px;border-radius:3px;font-size:8px;margin:1px;font-weight:bold}
.tag.green{background:var(--green)}.tag.yellow{background:var(--yellow)}.tag.red{background:var(--red)}
.img-placeholder{border:2px dashed var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:#1a1b2e;text-align:center;padding:12px;flex:1;min-height:0}
svg.diagram{display:block;width:100%;height:100%;min-height:0;background:#1a1b2e;border-radius:4px;border:1px solid var(--border)}
svg.diagram text{font-family:'Segoe UI',system-ui,sans-serif;fill:var(--text);font-size:9px}
svg.diagram text.title{font-size:10px;font-weight:bold;fill:var(--accent)}
svg.diagram rect.box{fill:#24283b;stroke:var(--border);rx:3}
svg.diagram rect.accent{fill:#1a1b2e;stroke:var(--accent);rx:3}
svg.diagram line.conn{stroke:var(--muted);stroke-width:1}
svg.diagram line.arrow{stroke:var(--accent);stroke-width:1.2;marker-end:url(#arrow)}
.kv{display:flex;margin:1px 0;font-size:9.5px}.kv .key{color:var(--muted);min-width:90px}.kv .val{font-weight:bold}
table{width:100%;font-size:9px;border-collapse:collapse;margin-top:2px}
table td{padding:2px 4px;border-bottom:1px solid var(--border)}
table tr:first-child td{color:var(--accent);font-weight:bold;border-bottom:2px solid var(--border)}
@media print{body{background:#fff;color:#000}.slide{page-break-after:always;background:#fff;color:#000;overflow:visible!important}.slide-content{overflow:visible!important}.slide h1{color:#222}.slide h2{color:#444}}
</style>
<svg style="display:none"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7aa2f7"/></marker></defs></svg>
</head>
<body>
<div id="app"><div id="slides"></div></div>
<script>
const S=[];

S.push({t:"",c:`
<div style="text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px">
<div style="font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase">Đại học Quốc gia TP. Hồ Chí Minh<br>Trường Đại học Công nghệ Thông tin</div>
<h1 style="border:none;font-size:28px;color:var(--yellow);text-align:center">MÔ PHỎNG GAME SUPER MARIO 3D<br>VỚI THREE.JS & RAPIER PHYSICS</h1>
<div style="font-size:14px;color:var(--cyan)">Đồ án môn học: Đồ họa máy tính (CS105)</div>
<div style="margin-top:12px;padding:14px 28px;background:#1a1b2e;border-radius:6px;border:1px solid var(--border);text-align:left;font-size:12px;line-height:2">
<div><span style="color:var(--muted)">Giảng viên hướng dẫn: </span><span style="color:var(--text)">TS. Mai Tiến Dũng</span></div>
<div><span style="color:var(--muted)">Sinh viên thực hiện: </span><span style="color:var(--yellow)">&lt;&lt; Họ và tên &gt;&gt;</span></div>
<div><span style="color:var(--muted)">MSSV: </span><span style="color:var(--yellow)">&lt;&lt; MSSV &gt;&gt;</span></div>
<div><span style="color:var(--muted)">Lớp: </span><span style="color:var(--yellow)">&lt;&lt; Lớp &gt;&gt;</span></div>
<div><span style="color:var(--muted)">Học kỳ: </span><span style="color:var(--text)">2025-2026</span></div>
</div>
<div style="font-size:9px;color:var(--muted)">TP. Hồ Chí Minh, tháng 06 năm 2026</div>
</div>
`});

S.push({t:"Mục tiêu đồ án",c:`
<p style="font-size:11px">Xây dựng chương trình <span class="tag">mô phỏng game platformer 3D</span> hoàn chỉnh, áp dụng toàn bộ các kỹ thuật đồ họa 3D đã học trong môn CS105 vào một sản phẩm thực tế có tính tương tác cao.</p>
<h2>Mục tiêu cụ thể</h2>
<div class="grid2" style="flex:1"><div class="card"><h3>Kiến thức đồ họa</h3><ul><li>Phép chiếu phối cảnh (PerspectiveCamera)</li><li>Phép biến đổi Affine (tịnh tiến, xoay, tỉ lệ)</li><li>Hệ thống chiếu sáng (Directional + Hemisphere)</li><li>Shadow Mapping PCF soft shadows</li><li>Texture mapping (GLTF PBR + Canvas)</li><li>Animation keyframe từ model skeleton</li></ul></div><div class="card"><h3>Kỹ năng phát triển</h3><ul><li>Engine game tách rời logic game</li><li>Tích hợp physics engine (Rapier3D)</li><li>Scene Manager + vòng đời GameObject</li><li>Frustum Culling tối ưu hiệu năng</li><li>Kiến trúc module mở rộng</li></ul></div></div>
<h2>Kiến trúc tổng quan</h2>
<div style="flex:1;min-height:0"><svg class="diagram" viewBox="0 0 720 200" style="border:none;background:transparent"><text x="360" y="14" text-anchor="middle" class="title">Kiến trúc phân tầng Engine / Game</text><rect x="10" y="22" width="700" height="72" class="accent" rx="5"/><text x="360" y="36" text-anchor="middle" fill="#7aa2f7" font-size="11" font-weight="bold">TẦNG ENGINE</text><rect x="18" y="44" width="72" height="18" class="box"/><text x="54" y="56" text-anchor="middle">World</text><rect x="96" y="44" width="72" height="18" class="box"/><text x="132" y="56" text-anchor="middle">PhysWorld</text><rect x="174" y="44" width="90" height="18" class="box"/><text x="219" y="56" text-anchor="middle">ContentMgr</text><rect x="270" y="44" width="82" height="18" class="box"/><text x="311" y="56" text-anchor="middle">InputMgr</text><rect x="358" y="44" width="72" height="18" class="box"/><text x="394" y="56" text-anchor="middle">GameObj</text><rect x="436" y="44" width="85" height="18" class="box"/><text x="478" y="56" text-anchor="middle">SceneMgr</text><rect x="527" y="44" width="55" height="18" class="box"/><text x="554" y="56" text-anchor="middle">Anim</text><rect x="588" y="44" width="55" height="18" class="box"/><text x="615" y="56" text-anchor="middle">Timer</text><rect x="649" y="44" width="55" height="18" class="box"/><text x="676" y="56" text-anchor="middle">Utils</text><rect x="18" y="66" width="72" height="18" class="box"/><text x="54" y="78" text-anchor="middle">Inspector</text><rect x="96" y="66" width="72" height="18" class="box"/><text x="132" y="78" text-anchor="middle">TweenMgr</text><rect x="174" y="66" width="90" height="18" class="box"/><text x="219" y="78" text-anchor="middle">Math/Utils</text><line x1="360" y1="97" x2="360" y2="112" class="arrow"/><rect x="10" y="117" width="700" height="72" class="accent" rx="5"/><text x="360" y="131" text-anchor="middle" fill="#7aa2f7" font-size="11" font-weight="bold">TẦNG GAME</text><rect x="18" y="140" width="100" height="18" class="box"/><text x="68" y="153" text-anchor="middle">MainMenu</text><rect x="124" y="140" width="60" height="18" class="box"/><text x="154" y="153" text-anchor="middle">Scene2</text><text x="195" y="153" fill="var(--muted)" font-size="10">→</text><rect x="205" y="140" width="55" height="18" class="box"/><text x="232" y="153" text-anchor="middle">Player</text><rect x="266" y="140" width="55" height="18" class="box"/><text x="293" y="153" text-anchor="middle">Koopa</text><rect x="327" y="140" width="55" height="18" class="box"/><text x="354" y="153" text-anchor="middle">Goomba</text><rect x="388" y="140" width="45" height="18" class="box"/><text x="410" y="153" text-anchor="middle">Coin</text><rect x="439" y="140" width="45" height="18" class="box"/><text x="461" y="153" text-anchor="middle">Brick</text><rect x="490" y="140" width="60" height="18" class="box"/><text x="520" y="153" text-anchor="middle">Camera</text><rect x="556" y="140" width="60" height="18" class="box"/><text x="586" y="153" text-anchor="middle">Ground</text><rect x="622" y="140" width="80" height="18" class="box"/><text x="662" y="153" text-anchor="middle">+10 others</text><rect x="18" y="164" width="55" height="18" class="box"/><text x="45" y="177" text-anchor="middle">OneWay</text><rect x="79" y="164" width="55" height="18" class="box"/><text x="106" y="177" text-anchor="middle">KillZone</text><rect x="140" y="164" width="55" height="18" class="box"/><text x="167" y="177" text-anchor="middle">PlayZone</text><rect x="201" y="164" width="55" height="18" class="box"/><text x="228" y="177" text-anchor="middle">LevelEnd</text><rect x="262" y="164" width="65" height="18" class="box"/><text x="294" y="177" text-anchor="middle">Mushroom</text><rect x="333" y="164" width="80" height="18" class="box"/><text x="373" y="177" text-anchor="middle">QuestionBlock</text><rect x="419" y="164" width="75" height="18" class="box"/><text x="456" y="177" text-anchor="middle">ScorePopup</text><rect x="500" y="164" width="80" height="18" class="box"/><text x="540" y="177" text-anchor="middle">Particles</text><rect x="586" y="164" width="60" height="18" class="box"/><text x="616" y="177" text-anchor="middle">Decorate</text></svg></div>
`});

S.push({t:"Ý tưởng chương trình",c:`
<div style="display:grid;grid-template-columns:52% 48%;gap:14px;flex:1;min-height:0;height:100%"><div style="display:flex;flex-direction:column;gap:10px;height:100%"><div class="card" style="flex:1.2;justify-content:center;padding:12px 18px"><h2 style="font-size:15px;color:var(--yellow);margin-bottom:6px;border-left:4px solid var(--accent);padding-left:10px">Tổng quan</h2><p style="font-size:11.5px;line-height:1.5">Game platformer 3D lấy cảm hứng từ <strong>Super Mario Bros</strong> — người chơi điều khiển nhân vật vượt chướng ngại vật, thu thập xu, tiêu diệt kẻ địch. Xây dựng trên <strong>WebGL 2.0</strong> qua Three.js, kết hợp vật lý <strong>Rapier3D</strong>.</p></div><div class="card" style="flex:1;justify-content:center;padding:10px 18px"><h2 style="font-size:15px;color:var(--yellow);margin-bottom:6px;border-left:4px solid var(--accent);padding-left:10px">Tương tác người dùng</h2><div style="display:flex;flex-wrap:wrap;gap:6px;font-size:11px;line-height:1.6"><span class="tag yellow" style="font-size:10px;padding:3px 7px">A / D</span> Di chuyển &nbsp;·&nbsp;<span class="tag yellow" style="font-size:10px;padding:3px 7px">Space</span> Nhảy (giữ = cao hơn) &nbsp;·&nbsp;<span class="tag yellow" style="font-size:10px;padding:3px 7px">J</span> Chạy &nbsp;·&nbsp;<span class="tag yellow" style="font-size:10px;padding:3px 7px">S</span> Ngồi &nbsp;·&nbsp;<span class="tag yellow" style="font-size:10px;padding:3px 7px">C</span> Orbit Cam &nbsp;·&nbsp;<span class="tag" style="font-size:10px;padding:3px 7px">I</span> Slow-mo</div></div><div class="card" style="flex:1;justify-content:center;padding:10px 18px"><h2 style="font-size:15px;color:var(--yellow);margin-bottom:6px;border-left:4px solid var(--accent);padding-left:10px">Công nghệ sử dụng</h2><div style="display:flex;flex-wrap:wrap;gap:5px"><span class="tag" style="font-size:10px;padding:3px 7px">Three.js v0.184</span><span class="tag" style="font-size:10px;padding:3px 7px">Rapier3D v0.19</span><span class="tag green" style="font-size:10px;padding:3px 7px">WebGL 2.0</span><span class="tag green" style="font-size:10px;padding:3px 7px">TypeScript</span><span class="tag yellow" style="font-size:10px;padding:3px 7px">Vite</span><span class="tag yellow" style="font-size:10px;padding:3px 7px">Bun</span><span class="tag" style="font-size:10px;padding:3px 7px">Tween.js</span><span class="tag" style="font-size:10px;padding:3px 7px">dat.gui</span><span class="tag green" style="font-size:10px;padding:3px 7px">Canvas API</span></div></div></div><div class="card" style="padding:14px;display:flex;justify-content:center;align-items:center"><svg class="diagram" viewBox="0 0 280 345" style="border:none;background:transparent;width:100%;height:100%;max-height:460px;max-width:350px;object-fit:contain"><text x="140" y="12" text-anchor="middle" class="title">Game Loop (mỗi frame)</text><rect x="25" y="20" width="230" height="22" class="box"/><text x="140" y="35" text-anchor="middle">1. Input (keyboard/mouse)</text><line x1="140" y1="42" x2="140" y2="52" class="arrow"/><rect x="25" y="52" width="230" height="22" class="box"/><text x="140" y="67" text-anchor="middle">2. Player.update()</text><line x1="140" y1="74" x2="140" y2="84" class="arrow"/><rect x="25" y="84" width="230" height="22" class="box"/><text x="140" y="99" text-anchor="middle">3. Physics World.step() (60Hz)</text><line x1="140" y1="106" x2="140" y2="112" class="conn"/><line x1="55" y1="112" x2="225" y2="112" class="conn"/><line x1="55" y1="112" x2="55" y2="122" class="arrow"/><line x1="140" y1="112" x2="140" y2="122" class="arrow"/><line x1="225" y1="112" x2="225" y2="122" class="arrow"/><rect x="5" y="122" width="95" height="22" class="box"/><text x="52" y="137" text-anchor="middle">Goomba AI</text><rect x="105" y="122" width="55" height="22" class="box"/><text x="132" y="137" text-anchor="middle">Koopa</text><rect x="165" y="122" width="65" height="22" class="box"/><text x="197" y="137" text-anchor="middle">Coin/Mush</text><rect x="235" y="122" width="40" height="22" class="box"/><text x="255" y="137" text-anchor="middle">...</text><line x1="52" y1="144" x2="52" y2="150" class="conn"/><line x1="132" y1="144" x2="132" y2="150" class="conn"/><line x1="197" y1="144" x2="197" y2="150" class="conn"/><line x1="255" y1="144" x2="255" y2="150" class="conn"/><line x1="25" y1="150" x2="260" y2="150" class="conn"/><line x1="140" y1="150" x2="140" y2="160" class="arrow"/><rect x="25" y="160" width="230" height="22" class="box"/><text x="140" y="175" text-anchor="middle">4. Collision Detection + Response</text><line x1="140" y1="182" x2="140" y2="192" class="arrow"/><rect x="25" y="192" width="230" height="22" class="box"/><text x="140" y="207" text-anchor="middle">5. AnimationMixer.update()</text><line x1="140" y1="214" x2="140" y2="224" class="arrow"/><rect x="25" y="224" width="230" height="22" class="box"/><text x="140" y="239" text-anchor="middle">6. Renderer.render(scene, camera)</text><line x1="140" y1="246" x2="140" y2="256" class="arrow"/><rect x="25" y="256" width="230" height="22" class="box"/><text x="140" y="271" text-anchor="middle">7. InputManager.update()</text><line x1="140" y1="278" x2="140" y2="288" class="arrow"/><rect x="40" y="288" width="200" height="20" class="box"/><text x="140" y="302" text-anchor="middle">Loop ≈ 60 fps</text></svg></div></div>
`});

S.push({t:"Các chức năng chính của chương trình",c:`
<div class="grid3" style="flex:1.1;min-height:0"><div class="card"><h3>Vẽ khối 3D & Load Model</h3><ul><li>BoxGeometry cho collider shape</li><li>GLTF/GLB cho nhân vật & địa hình</li><li>17+ model: Mario, Goomba, Koopa, Coin, Brick, Star, Mushroom...</li><li>Level load từ JSON động</li></ul><div style="margin-top:auto"><span class="tag">GLTFLoader</span> <span class="tag">SkeletonUtils</span></div></div><div class="card"><h3>Camera & Phép chiếu</h3><ul><li><strong>PerspectiveCamera</strong> FOV 45°, near 1, far 500</li><li>Follow camera bám theo Player</li><li>Giới hạn camera trong PlayZone (viewport clamp)</li><li>OrbitControls debug (C)</li><li>Frustum culling CPU-side</li></ul><div style="margin-top:auto"><span class="tag green">Phối cảnh</span> <span class="tag">Frustum</span></div></div><div class="card"><h3>Phép biến đổi Affine</h3><ul><li><strong>Tịnh tiến</strong>: di chuyển player, enemy, items, score</li><li><strong>Xoay</strong>: coin rotateY, death spin rotateX, shell roll</li><li><strong>Tỉ lệ</strong>: Power-up BIG 1.5x, squash & stretch</li><li>Đồng bộ transform Three.js ↔ Rapier collider</li></ul><div style="margin-top:auto"><span class="tag yellow">T·R·S</span> <span class="tag">matrix</span></div></div></div><div class="grid3" style="flex:1.1;min-height:0"><div class="card"><h3>Chiếu sáng & Bóng đổ</h3><ul><li><strong>DirectionalLight</strong> mặt trời, intensity 2.0</li><li><strong>HemisphereLight</strong> bầu trời + mặt đất, intensity 2.0</li><li>Shadow Map: PCFSoft, 2048×2048</li><li>Shadow frustum động theo camera (Dynamic tracking)</li><li>Bias -0.001 chống shadow acne</li></ul><div style="margin-top:auto"><span class="tag">PCFSoft</span> <span class="tag green">2048</span></div></div><div class="card"><h3>Texture & Model</h3><ul><li>PBR materials từ GLTF model (color, roughness, metalness)</li><li>Canvas API sky gradient: Scene2 256², Menu 4×256</li><li>TextGeometry + font Mario cho chữ 3D</li><li>ContentManager: cache + dedup + dispose</li></ul><div style="margin-top:auto"><span class="tag green">Canvas</span> <span class="tag">TextGeometry</span></div></div><div class="card"><h3>Animation & Hiệu ứng</h3><ul><li>AnimationMixer + crossfade (16 clips / 3 nhân vật)</li><li>Particle system: chạy, nhảy, tiếp đất (4 loại hạt)</li><li>Score popup 3D bay lên (gravity riêng)</li><li>Parallax scrolling menu nền 6 lớp</li><li>Procedural: coin bob, block bounce, star rotate</li></ul><div style="margin-top:auto"><span class="tag yellow">keyframe</span> <span class="tag">procedural</span></div></div></div>
`});

S.push({t:"Giới thiệu các kỹ thuật đồ họa sử dụng",c:`
<div class="grid3" style="flex:1.2;min-height:0"><div class="card"><h3>1. Phép chiếu phối cảnh</h3><div class="kv"><span class="key">Camera</span><span class="val">PerspectiveCamera</span></div><div class="kv"><span class="key">FOV</span><span class="val">45°</span></div><div class="kv"><span class="key">Near / Far</span><span class="val">1 / 500</span></div><div class="kv"><span class="key">Aspect</span><span class="val">Cân bằng động (W/H)</span></div><p style="font-size:9px;margin-top:2px;color:var(--muted)">Bám Player, giới hạn trong PlayZone (viewport clamp), hỗ trợ OrbitControls (C) để debug.</p></div><div class="card"><h3>2. Phép biến đổi Affine</h3><table style="margin-top:1px;font-size:8.5px"><tr><td>Phép biến đổi</td><td>Ma trận</td><td>Ứng dụng trong mã nguồn</td></tr><tr><td>Tịnh tiến</td><td>T(dx,dy,dz)</td><td>Mario, AI Goomba, Score popup</td></tr><tr><td>Xoay</td><td>R(θ,axis)</td><td>Coin quay trục Y, Koopa lăn mai tròn</td></tr><tr><td>Tỉ lệ</td><td>S(sx,sy,sz)</td><td>Phóng to 1.5x khi ăn nấm, Squash/Stretch</td></tr></table></div><div class="card"><h3>3. Chiếu sáng & Shadow</h3><div style="flex:1;min-height:0;display:flex;align-items:center"><svg class="diagram" viewBox="0 0 300 90" style="border:none;background:transparent;width:100%;height:100%"><rect x="5" y="3" width="140" height="26" class="box"/><text x="75" y="14" text-anchor="middle" fill="var(--yellow)" font-size="9">DirectionalLight</text><text x="75" y="24" text-anchor="middle" font-size="7">0xfff2cc · i=2.0</text><rect x="155" y="3" width="140" height="26" class="box"/><text x="225" y="14" text-anchor="middle" fill="var(--cyan)" font-size="9">HemisphereLight</text><text x="225" y="24" text-anchor="middle" font-size="7">sky/ground · i=2.0</text><rect x="5" y="35" width="290" height="46" style="fill:#1a1b2e;stroke:var(--green);rx:3;stroke-width:1.2"/><text x="150" y="50" text-anchor="middle" fill="var(--green)" font-size="9" font-weight="bold">Shadow Mapping: PCFSoft 2048×2048</text><text x="150" y="63" text-anchor="middle" font-size="7">frustum [-40,40]×[-20,20] · bias -0.001</text><text x="150" y="75" text-anchor="middle" font-size="7">Dynamic: Shadow camera tự bám theo Player</text></svg></div></div></div><div class="grid3" style="flex:1.2;min-height:0"><div class="card"><h3>4. Shadow Mapping</h3><ul style="font-size:9.5px;line-height:1.35"><li><strong>PCFSoft (Percentage Closer Filtering)</strong>: Nội suy lọc đa mẫu cho biên bóng mềm, mịn.</li><li>Bản đồ shadow kích thước lớn <span class="tag green" style="padding:0 3px">2048×2048</span>.</li><li>Thiết lập Bias -0.001 triệt tiêu lỗi sọc bóng (shadow acne).</li><li><strong>Dynamic tracking</strong>: Đuổi trục ánh sáng theo vị trí camera để tối ưu hóa bộ nhớ đệm bóng đổ.</li></ul></div><div class="card"><h3>5. Texture Mapping</h3><ul style="font-size:9.5px;line-height:1.35"><li>PBR materials nạp trực tiếp từ GLTF (màu nền, độ nhám roughness, kim loại metalness).</li><li>Canvas Gradient: Tạo bầu trời chuyển màu dịu mắt bằng Canvas 2D (Scene2: 256², Menu: 4×256).</li><li><strong>TextGeometry + Font Mario</strong> tạo chữ 3D nổi bật.</li><li>Score popup: Ghép đè 2 mesh (outline + fill) tăng chiều sâu đồ họa.</li></ul></div><div class="card"><h3>6. Animation Pipeline</h3><div style="flex:1;min-height:0;display:flex;align-items:center"><svg class="diagram" viewBox="0 0 300 100" style="border:none;background:transparent;width:100%;height:100%"><text x="150" y="10" text-anchor="middle" class="title" font-size="8">Từ GLTF Model tới Frame Render</text><rect x="5" y="18" width="135" height="18" class="box"/><text x="72" y="30" text-anchor="middle">GLTF skeleton</text><line x1="140" y1="27" x2="155" y2="27" class="arrow"/><rect x="160" y="18" width="135" height="18" class="box"/><text x="227" y="30" text-anchor="middle">AnimationMixer</text><line x1="72" y1="36" x2="72" y2="48" class="arrow"/><line x1="227" y1="36" x2="227" y2="48" class="arrow"/><rect x="5" y="48" width="135" height="18" class="box"/><text x="72" y="60" text-anchor="middle">Animator wrapper</text><rect x="160" y="48" width="135" height="18" class="box"/><text x="227" y="60" text-anchor="middle">16 AnimationClips</text><line x1="72" y1="66" x2="72" y2="76" class="arrow"/><line x1="227" y1="66" x2="227" y2="76" class="arrow"/><rect x="5" y="76" width="135" height="18" class="box"/><text x="72" y="88" text-anchor="middle">playAnimation(idx)</text><rect x="160" y="76" width="135" height="18" class="box"/><text x="227" y="88" text-anchor="middle">SkeletonUtils.clone()</text></svg></div></div></div><div class="card" style="flex-shrink:0;padding:6px 12px"><h3>7. Kỹ thuật bổ trợ</h3><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1"><span class="tag" style="font-size:12px;padding:4px 10px">Frustum Culling</span><span class="tag green" style="font-size:12px;padding:4px 10px">Parallax Scrolling</span><span class="tag yellow" style="font-size:12px;padding:4px 10px">Particle System</span><span class="tag" style="font-size:12px;padding:4px 10px">One-way Platform</span><span class="tag green" style="font-size:12px;padding:4px 10px">Deferred Collision</span><span class="tag yellow" style="font-size:12px;padding:4px 10px">Physics 60Hz</span><span class="tag" style="font-size:12px;padding:4px 10px">Timescale Control</span></div></div>
`});

<h2 style="font-size:12px;margin:0">Kết quả đạt được</h2><div class="grid3" style="flex:1.1"><div class="card"><h3>Đồ họa 3D</h3><ul><li>Phép chiếu phối cảnh hoàn chỉnh</li><li>Affine transforms đầy đủ</li><li>Chiếu sáng PBR 2 nguồn</li><li>Shadow mapping PCFSoft</li><li>17+ model GLTF load & render</li><li>Animation 16 clip / 3 nhân vật</li></ul></div><div class="card"><h3>Vật lý & Gameplay</h3><ul><li>Trọng lực 9.81 m/s²</li><li>Character controller mượt</li><li>Va chạm solid + sensor</li><li>Enemy AI state machine</li><li>Cơ chế game hoàn chỉnh</li></ul></div><div class="card"><h3>Kiến trúc phần mềm</h3><ul><li>Engine / Game tách rời</li><li>Scene manager + reset</li><li>Vòng đời GameObject chặt chẽ</li><li>Content pipeline cache</li><li>Input per-frame polling</li></ul></div></div><h2 style="font-size:12px;margin:0">Hạn chế hiện tại</h2><div class="grid2" style="flex:1"><div class="card"><ul><li>Góc camera cố định 2.5D, chưa xoay tự do</li><li>Chỉ 1 level, chưa có level editor</li><li>Không có UI HUD</li><li>Chưa có âm thanh</li></ul></div><div class="card"><ul><li>Power-up Racoon chưa implement</li><li>Koopa Respawn chưa hoàn thiện</li><li>Chưa hỗ trợ mobile</li><li>Chưa auto-resize</li></ul></div></div><h2 style="font-size:12px;margin:0">Hướng phát triển</h2><div class="grid3" style="flex:1.1"><div class="card"><h3>Ngắn hạn</h3><ul><li>UI HUD + âm thanh</li><li>Hoàn thiện Racoon, Respawn</li><li>Responsive resize</li></ul></div><div class="card"><h3>Trung hạn</h3><ul><li>Level editor</li><li>Nhiều level (2-3 màn)</li><li>Hỗ trợ mobile</li><li>High score + save/load</li></ul></div><div class="card"><h3>Dài hạn</h3><ul><li>Multiplayer (WebSocket)</li><li>VR mode (WebXR)</li><li>Procedural generation</li><li>Port Electron/Tauri</li></ul></div></div><div style="text-align:center;padding:6px;background:#1a1b2e;border-radius:4px;flex-shrink:0;margin-top:2px"><p style="font-size:10px;color:var(--accent);margin:0"><strong>Tổng kết:</strong> Dự án đã áp dụng toàn bộ ki let cur=0;
const c=document.getElementById("slides");
function r(i){
  const sl=S[i];
  c.innerHTML=`<div class="slide" style="display:flex">${sl.t?`<h1>${sl.t}</h1>`:""}<div class="slide-content">${sl.c}</div></div>`;
}
r(0);
document.onkeydown=e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();if(cur<S.length-1){cur++;r(cur)}}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();if(cur>0){cur--;r(cur)}}
  else if(e.key==="Home"){e.preventDefault();cur=0;r(cur)}
  else if(e.key==="End"){e.preventDefault();cur=S.length-1;r(cur)}
};
</script>
